<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VMC Operator HMI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Primeform Labs</p>
          <h1>VMC Operator HMI</h1>
        </div>
        <div class="status-block">
          <span class="status-label">Operation Status</span>
          <strong id="operationStatus" class="status-pill">READY</strong>
        </div>
      </header>

      <main class="layout">
        <aside class="panel summary-panel">
          <h2>Mock Job</h2>
          <div id="jobSummary" class="summary-list"></div>
          <button id="resetButton" class="secondary-button">Reset Demo</button>
        </aside>

        <section class="panel main-panel">
          <div class="stage-header">
            <div>
              <p class="eyebrow">Current Stage</p>
              <h2 id="stageTitle">Loading...</h2>
            </div>
            <p id="stageHint" class="stage-hint"></p>
          </div>

          <div id="progressBar" class="progress-bar"></div>
          <div id="stageContent" class="stage-content"></div>

          <div class="actions">
            <button id="nextButton" class="primary-button">Next</button>
            <button id="startButton" class="primary-button accent-button">Start Operation</button>
            <button id="stopButton" class="secondary-button">Stop Operation</button>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
